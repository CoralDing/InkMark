    <filter id="windowShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#203237" flood-opacity="0.22"/>
    </filter>
    <clipPath id="previewClip">
      <rect x="598" y="90" width="622" height="460" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <path d="M0 0H494C554 120 574 238 558 354C540 480 490 574 416 640H0V0Z" fill="url(#inkPanel)"/>
  <path d="M0 0H494C554 120 574 238 558 354C540 480 490 574 416 640" fill="none" stroke="#57c8b6" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="492" cy="72" r="6" fill="#4fc5b2"/>
  <circle cx="516" cy="48" r="3" fill="#4fc5b2" opacity="0.55"/>

  <image x="68" y="62" width="124" height="124" xlink:href="moji-app-icon.png" filter="url(#iconShadow)"/>

  <text x="68" y="276" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="70" font-weight="700">墨记</text>
  <text x="68" y="326" fill="#86d8ca" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="27" font-weight="600">INKMARK</text>
  <text x="68" y="404" fill="#dce7e5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="26" font-weight="500">清晰、快速、本地优先的</text>
  <text x="68" y="444" fill="#dce7e5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="26" font-weight="500">macOS Markdown 编辑器</text>

  <g transform="translate(68 515)">
    <rect width="126" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="22" cy="21" r="5" fill="#53c8b5"/>
    <text x="38" y="28" fill="#f2f7f6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500">原生体验</text>
  </g>
  <g transform="translate(208 515)">
    <rect width="126" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="22" cy="21" r="5" fill="#53c8b5"/>
    <text x="38" y="28" fill="#f2f7f6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500">实时预览</text>
  </g>

  <g filter="url(#windowShadow)">
    <rect x="580" y="72" width="658" height="496" rx="24" fill="#ffffff"/>
    <rect x="580.5" y="72.5" width="657" height="495" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
    <g clip-path="url(#previewClip)">
      <image x="598" y="90" width="622" height="494" preserveAspectRatio="xMidYMin slice" xlink:href="app-preview.png"/>
