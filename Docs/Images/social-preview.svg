<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1180" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9fbfb"/>
      <stop offset="0.62" stop-color="#eef4f3"/>
      <stop offset="1" stop-color="#e4eeec"/>
    </linearGradient>
    <linearGradient id="inkPanel" x1="0" y1="0" x2="540" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#223238"/>
      <stop offset="1" stop-color="#111d22"/>
    </linearGradient>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071014" flood-opacity="0.34"/>
