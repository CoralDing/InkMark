# 文件说明：墨记 GitHub Release 自动发布流程，按版本标签构建并上传三种 macOS 架构安装包。
# 作者：dingyi60(Codex)
# 创建时间：2026-08-05

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-plantuml-runtime:
    name: Build PlantUML runtime (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # jlink 只能输出与当前机器架构一致的原生库，两个运行时必须分别在对应架构的 macOS 构建机生成。
          - architecture: arm64
            runner: macos-15
            java_architecture: aarch64
          - architecture: x86_64
            runner: macos-13
            java_architecture: x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17.0.20+8
          architecture: ${{ matrix.java_architecture }}

      - name: Build minimal PlantUML runtime
        run: scripts/build-plantuml-runtime.sh "$RUNNER_TEMP/runtime-${{ matrix.architecture }}"

      - name: Upload minimal PlantUML runtime
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-runtime-${{ matrix.architecture }}
          path: ${{ runner.temp }}/runtime-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build and publish macOS DMG
    needs: prepare-plantuml-runtime
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download minimal PlantUML runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: plantuml-runtime-*
          path: ${{ runner.temp }}/plantuml-runtimes

      - name: Install minimal PlantUML runtimes
        shell: bash
        run: |
          set -euo pipefail
          # 运行时来自对应架构的构建机，替换源码中完整 JRE 后再进行预览测试和发布打包。
          rm -rf InkMark/Resources/PlantUML/runtime-arm64 InkMark/Resources/PlantUML/runtime-x86_64
          cp -R "$RUNNER_TEMP/plantuml-runtimes/plantuml-runtime-arm64" InkMark/Resources/PlantUML/runtime-arm64
          cp -R "$RUNNER_TEMP/plantuml-runtimes/plantuml-runtime-x86_64" InkMark/Resources/PlantUML/runtime-x86_64

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "发布标签必须使用 v1.0.0 形式，当前值：$RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' InkMark/InkMark-Info.plist)"
          if [[ "$VERSION" != "$PLIST_VERSION" ]]; then
            echo "标签版本 $VERSION 与 Info.plist 版本 $PLIST_VERSION 不一致。" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate project files
        run: |
          plutil -lint InkMark/InkMark-Info.plist InkMark.xcodeproj/project.pbxproj
          xmllint --noout InkMark.xcodeproj/xcshareddata/xcschemes/InkMark.xcscheme

      - name: Test Markdown renderer
        run: |
          xcrun swiftc \
            InkMark/Sources/Core/Markdown/ModernMarkdownRenderer.swift \
            Tests/RendererSmokeTests/main.swift \
            -o /tmp/moji-renderer-tests
          /tmp/moji-renderer-tests

      - name: Test preview runtime
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d "${RUNNER_TEMP}/moji-preview-runtime.XXXXXX")"
          TEST_APP="${TEST_ROOT}/MojiPreviewRuntimeTests.app"
          TEST_EXECUTABLE="${TEST_APP}/Contents/MacOS/MojiPreviewRuntimeTests"
          trap 'rm -rf "$TEST_ROOT"' EXIT

          # 预览依赖 Bundle.main 查找本地脚本和 PlantUML 运行时，测试程序必须具备标准应用包结构。
          mkdir -p "${TEST_APP}/Contents/MacOS" "${TEST_APP}/Contents/Resources"
          cp InkMark/InkMark-Info.plist "${TEST_APP}/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleExecutable MojiPreviewRuntimeTests' \
            "${TEST_APP}/Contents/Info.plist"
          cp \
            InkMark/Resources/mermaid.min.js \
            InkMark/Resources/katex.min.js \
            InkMark/Resources/katex-auto-render.min.js \
            InkMark/Resources/katex.min.css \
            "${TEST_APP}/Contents/Resources/"
          cp -R InkMark/Resources/PlantUML "${TEST_APP}/Contents/Resources/"

          xcrun swiftc \
            -framework AppKit \
            -framework WebKit \
            InkMark/Sources/Core/Markdown/ModernMarkdownRenderer.swift \
            InkMark/Sources/Core/Preferences/MojiPreferences.swift \
            InkMark/Sources/Core/Plugins/MojiPluginManager.swift \
            InkMark/Sources/Core/Diagram/MojiPlantUMLRenderer.swift \
            InkMark/Sources/Features/Preview/Modern/ModernPreviewViewController.swift \
            Tests/PreviewRuntimeTests/main.swift \
            -o "$TEST_EXECUTABLE"
          "$TEST_EXECUTABLE" \
            "$GITHUB_WORKSPACE/Examples/墨记完整功能演示.md"

      - name: Build release DMGs
        run: |
          ./package.sh universal
          ./package.sh arm64
          ./package.sh x86_64

      - name: Prepare release assets
        id: assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for ARCHITECTURE in universal arm64 x86_64; do
            SOURCE_DMG="$(find outputs -maxdepth 1 -type f -name "墨记-${VERSION}-${ARCHITECTURE}-*.dmg" -print -quit)"
            if [[ -z "$SOURCE_DMG" ]]; then
              echo "没有找到版本 ${VERSION}、架构 ${ARCHITECTURE} 的 DMG 产物。" >&2
              exit 1
            fi

            # GitHub Release 会清理附件文件名中的非 ASCII 字符，使用英文品牌名可避免中文前缀被移除。
            RELEASE_DMG="outputs/InkMark-${VERSION}-macOS-${ARCHITECTURE}.dmg"
            CHECKSUM_FILE="${RELEASE_DMG}.sha256"
            mv "$SOURCE_DMG" "$RELEASE_DMG"
            (
              cd outputs
              shasum -a 256 "$(basename "$RELEASE_DMG")" > "$(basename "$CHECKSUM_FILE")"
            )
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 墨记-${{ steps.version.outputs.version }}-macOS
          path: outputs/InkMark-${{ steps.version.outputs.version }}-macOS-*.dmg*
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_ASSETS=(
            outputs/InkMark-"${VERSION}"-macOS-*.dmg
            outputs/InkMark-"${VERSION}"-macOS-*.dmg.sha256
          )
          if [[ "${#RELEASE_ASSETS[@]}" -ne 6 ]]; then
            echo "发布产物数量异常，期望 6 个，实际 ${#RELEASE_ASSETS[@]} 个。" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "${RELEASE_ASSETS[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "${RELEASE_ASSETS[@]}" \
              --title "墨记 ${VERSION}" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
