# 文件说明：墨记 GitHub Release 自动发布流程，按版本标签构建并上传三种 macOS 架构安装包。
# 作者：dingyi60(Codex)
# 创建时间：2026-08-05

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-plantuml-component:
    name: Build PlantUML component (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-java 会安装与目标一致的 JDK；macOS 15 的 Apple Silicon 构建机已提供 Rosetta，可执行 x86_64 JDK 生成 Intel 运行时。
          - architecture: arm64
            runner: macos-15
            java_architecture: aarch64
          - architecture: x86_64
            runner: macos-15
            java_architecture: x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17.0.20+8
          architecture: ${{ matrix.java_architecture }}

      - name: Build minimal PlantUML runtime
        run: scripts/build-plantuml-runtime.sh "$RUNNER_TEMP/runtime-${{ matrix.architecture }}"

      - name: Download PlantUML JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v1.2025.10/plantuml-1.2025.10.jar"
          test -s "$RUNNER_TEMP/plantuml.jar"

      - name: Package PlantUML component
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT_ROOT="$RUNNER_TEMP/plantuml-component-${{ matrix.architecture }}"
          COMPONENT_DIRECTORY="$COMPONENT_ROOT/PlantUML"
          ARCHIVE="$RUNNER_TEMP/InkMark-PlantUML-${{ matrix.architecture }}.zip"
          CHECKSUM_FILE="${ARCHIVE}.sha256"

          mkdir -p "$COMPONENT_DIRECTORY"
          cp "$RUNNER_TEMP/plantuml.jar" "$COMPONENT_DIRECTORY/plantuml.jar"
          cp -R "$RUNNER_TEMP/runtime-${{ matrix.architecture }}" "$COMPONENT_DIRECTORY/runtime-${{ matrix.architecture }}"
          chmod +x "$COMPONENT_DIRECTORY/runtime-${{ matrix.architecture }}/Contents/Home/bin/java"
          # keepParent 固定 ZIP 根目录，客户端可以同时校验 JAR 与对应架构运行时。
          ditto -c -k --sequesterRsrc --keepParent "$COMPONENT_DIRECTORY" "$ARCHIVE"
          # 校验文件只记录 ZIP 文件名，避免下载到另一个构建任务后绝对路径失效。
          (
            cd "$(dirname "$ARCHIVE")"
            shasum -a 256 "$(basename "$ARCHIVE")" > "$CHECKSUM_FILE"
          )
          test -s "$ARCHIVE"
          test -s "$CHECKSUM_FILE"

      - name: Upload PlantUML component
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-component-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/InkMark-PlantUML-${{ matrix.architecture }}.zip
            ${{ runner.temp }}/InkMark-PlantUML-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build and publish macOS DMG
    needs: prepare-plantuml-component
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download arm64 PlantUML component
        uses: actions/download-artifact@v4
        with:
          name: plantuml-component-arm64
          path: ${{ runner.temp }}/plantuml-components

      - name: Download x86_64 PlantUML component
        uses: actions/download-artifact@v4
        with:
          name: plantuml-component-x86_64
          path: ${{ runner.temp }}/plantuml-components

      - name: Validate PlantUML component assets
        shell: bash
        run: |
          set -euo pipefail
          for ARCHITECTURE in arm64 x86_64; do
            ARCHIVE="$RUNNER_TEMP/plantuml-components/InkMark-PlantUML-${ARCHITECTURE}.zip"
            CHECKSUM_FILE="${ARCHIVE}.sha256"
            test -s "$ARCHIVE"
            test -s "$CHECKSUM_FILE"
            # 组件校验文件使用相对文件名，必须在附件下载目录内执行校验。
            (
              cd "$(dirname "$ARCHIVE")"
              shasum -a 256 -c "$(basename "$CHECKSUM_FILE")"
            )
          done

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "发布标签必须使用 v1.0.0 形式，当前值：$RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' InkMark/InkMark-Info.plist)"
          if [[ "$VERSION" != "$PLIST_VERSION" ]]; then
            echo "标签版本 $VERSION 与 Info.plist 版本 $PLIST_VERSION 不一致。" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate project files
        run: |
          plutil -lint InkMark/InkMark-Info.plist InkMark.xcodeproj/project.pbxproj
          xmllint --noout InkMark.xcodeproj/xcshareddata/xcschemes/InkMark.xcscheme

      - name: Test Markdown renderer
        run: |
          xcrun swiftc \
            InkMark/Sources/Core/Markdown/ModernMarkdownRenderer.swift \
            Tests/RendererSmokeTests/main.swift \
            -o /tmp/moji-renderer-tests
          /tmp/moji-renderer-tests

      - name: Test PlantUML component manager
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d "${RUNNER_TEMP}/moji-plantuml-component.XXXXXX")"
          TEST_HOME="${TEST_ROOT}/home"
          COMPONENT_SOURCE="${TEST_ROOT}/component-source"
          TEST_EXECUTABLE="${TEST_ROOT}/PlantUMLComponentManagerSmokeTests"
          trap 'rm -rf "$TEST_ROOT"' EXIT

          ditto -x -k "$RUNNER_TEMP/plantuml-components/InkMark-PlantUML-arm64.zip" "$COMPONENT_SOURCE"
          xcrun swiftc \
            InkMark/Sources/Core/Diagram/MojiPlantUMLComponentManager.swift \
            InkMark/Sources/Core/Diagram/MojiPlantUMLRenderer.swift \
            Tests/PlantUMLComponentManagerSmokeTests/main.swift \
            -o "$TEST_EXECUTABLE"
          CFFIXED_USER_HOME="$TEST_HOME" "$TEST_EXECUTABLE" "$COMPONENT_SOURCE/PlantUML"

      - name: Test preview runtime
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d "${RUNNER_TEMP}/moji-preview-runtime.XXXXXX")"
          TEST_APP="${TEST_ROOT}/MojiPreviewRuntimeTests.app"
          TEST_EXECUTABLE="${TEST_APP}/Contents/MacOS/MojiPreviewRuntimeTests"
          trap 'rm -rf "$TEST_ROOT"' EXIT

          # 预览依赖 Bundle.main 查找本地脚本；PlantUML 组件则安装到测试用户的应用支持目录。
          mkdir -p "${TEST_APP}/Contents/MacOS" "${TEST_APP}/Contents/Resources"
          cp InkMark/InkMark-Info.plist "${TEST_APP}/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleExecutable MojiPreviewRuntimeTests' \
            "${TEST_APP}/Contents/Info.plist"
          cp \
            InkMark/Resources/mermaid.min.js \
            InkMark/Resources/katex.min.js \
            InkMark/Resources/katex-auto-render.min.js \
            InkMark/Resources/katex.min.css \
            "${TEST_APP}/Contents/Resources/"
          TEST_HOME="${TEST_ROOT}/home"
          TEST_COMPONENT_DIRECTORY="${TEST_HOME}/Library/Application Support/InkMark"
          mkdir -p "$TEST_COMPONENT_DIRECTORY"
          ditto -x -k "$RUNNER_TEMP/plantuml-components/InkMark-PlantUML-arm64.zip" "$TEST_COMPONENT_DIRECTORY"
          # Artifact 不保留 Unix 可执行权限，组件安装器会恢复；测试直接解压时同样显式恢复。
          chmod +x "$TEST_COMPONENT_DIRECTORY/PlantUML/runtime-arm64/Contents/Home/bin/java"

          xcrun swiftc \
            -framework AppKit \
            -framework WebKit \
            InkMark/Sources/Core/Markdown/ModernMarkdownRenderer.swift \
            InkMark/Sources/Core/Preferences/MojiPreferences.swift \
            InkMark/Sources/Core/Plugins/MojiPluginManager.swift \
            InkMark/Sources/Core/Diagram/MojiPlantUMLComponentManager.swift \
            InkMark/Sources/Core/Diagram/MojiPlantUMLRenderer.swift \
            InkMark/Sources/Features/Preview/Modern/ModernPreviewViewController.swift \
            Tests/PreviewRuntimeTests/main.swift \
            -o "$TEST_EXECUTABLE"
          # Foundation 使用 CFFIXED_USER_HOME 而非 HOME 解析应用支持目录，确保测试不污染构建机用户目录。
          CFFIXED_USER_HOME="$TEST_HOME" "$TEST_EXECUTABLE" \
            "$GITHUB_WORKSPACE/Examples/墨记完整功能演示.md"

      - name: Build release DMGs
        run: |
          ./package.sh universal
          ./package.sh arm64
          ./package.sh x86_64

      - name: Prepare release assets
        id: assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for ARCHITECTURE in universal arm64 x86_64; do
            SOURCE_DMG="$(find outputs -maxdepth 1 -type f -name "墨记-${VERSION}-${ARCHITECTURE}-*.dmg" -print -quit)"
            if [[ -z "$SOURCE_DMG" ]]; then
              echo "没有找到版本 ${VERSION}、架构 ${ARCHITECTURE} 的 DMG 产物。" >&2
              exit 1
            fi

            # GitHub Release 会清理附件文件名中的非 ASCII 字符，使用英文品牌名可避免中文前缀被移除。
            RELEASE_DMG="outputs/InkMark-${VERSION}-macOS-${ARCHITECTURE}.dmg"
            CHECKSUM_FILE="${RELEASE_DMG}.sha256"
            mv "$SOURCE_DMG" "$RELEASE_DMG"
            (
              cd outputs
              shasum -a 256 "$(basename "$RELEASE_DMG")" > "$(basename "$CHECKSUM_FILE")"
            )
          done

          # 组件附件使用稳定文件名，应用可通过 releases/latest/download 自动获取当前架构版本。
          for ARCHITECTURE in arm64 x86_64; do
            COMPONENT_ARCHIVE="$RUNNER_TEMP/plantuml-components/InkMark-PlantUML-${ARCHITECTURE}.zip"
            COMPONENT_CHECKSUM="${COMPONENT_ARCHIVE}.sha256"
            test -s "$COMPONENT_ARCHIVE"
            test -s "$COMPONENT_CHECKSUM"
            cp "$COMPONENT_ARCHIVE" "outputs/InkMark-PlantUML-${ARCHITECTURE}.zip"
            cp "$COMPONENT_CHECKSUM" "outputs/InkMark-PlantUML-${ARCHITECTURE}.zip.sha256"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 墨记-${{ steps.version.outputs.version }}-macOS
          path: |
            outputs/InkMark-${{ steps.version.outputs.version }}-macOS-*.dmg*
            outputs/InkMark-PlantUML-*.zip*
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_ASSETS=(
            outputs/InkMark-"${VERSION}"-macOS-*.dmg
            outputs/InkMark-"${VERSION}"-macOS-*.dmg.sha256
            outputs/InkMark-PlantUML-arm64.zip
            outputs/InkMark-PlantUML-arm64.zip.sha256
            outputs/InkMark-PlantUML-x86_64.zip
            outputs/InkMark-PlantUML-x86_64.zip.sha256
          )
          if [[ "${#RELEASE_ASSETS[@]}" -ne 10 ]]; then
            echo "发布产物数量异常，期望 10 个，实际 ${#RELEASE_ASSETS[@]} 个。" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "${RELEASE_ASSETS[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "${RELEASE_ASSETS[@]}" \
              --title "墨记 ${VERSION}" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
