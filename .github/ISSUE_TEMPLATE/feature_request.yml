# 文件说明：墨记 GitHub 功能建议模板。
# 作者：Codex
# 创建时间：2026-07-29

name: 功能建议
description: 提议新的写作、预览或插件能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明当前工作流中的具体问题，而不是只描述期望按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式

