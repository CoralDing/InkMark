# 文件说明：墨记 GitHub Bug 报告模板。
# 作者：Codex
# 创建时间：2026-07-29

name: Bug 报告
description: 报告可以稳定复现的功能或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题可以在最新版本复现，并移除文档中的敏感信息。
  - type: input
    id: version
    attributes:
      label: 墨记版本
      placeholder: 例如 0.2.3
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与芯片
      placeholder: 例如 macOS 15.5 / Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 按顺序说明操作和使用的最小 Markdown 内容
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
